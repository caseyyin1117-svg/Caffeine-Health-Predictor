<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caffeine Health Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top-bar">
    <div class="brand">
        <div class="brand-logo">☕</div>
        <div class="brand-text">
            <div class="brand-title">Caffeine Health Predictor</div>
            <div class="brand-subtitle">Personalized insights for your daily coffee</div>
        </div>
    </div>

    <button id="themeToggle" class="icon-button" title="Toggle dark mode">
        🌙
    </button>
</header>

<main class="page">
    <div class="layout">

        <!-- Left: Input form -->
        <section class="card card-input">
            <h2 class="card-title">Your Profile & Intake</h2>

            <div class="form-grid">
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input id="age" type="number" min="1" placeholder="e.g. 25">
                </div>

                <div class="form-group">
                    <label>BMI</label>
                    <input id="bmi" type="number" step="0.1" min="10" placeholder="e.g. 20.5">
                </div>

                <div class="form-group">
                    <label>Stress Level</label>
                    <select id="stress">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>
                </div>

                <!-- Search Beverage -->
                <div class="form-group full-width" style="position: relative;">
                    <label>Coffee Drink</label>
                    <input
                        type="text"
                        id="drinkInput"
                        placeholder="Type to search (e.g., latte, espresso, matcha)"
                        autocomplete="off"
                    >
                    <div id="drinkDropdown" class="dropdown-list"></div>
                    <div id="drinkMeta" class="drink-meta"></div>
                </div>

                <div class="form-group">
                    <label>Volume (ml)</label>
                    <input id="volume" type="number" value="350">
                </div>

                <div class="form-group">
                    <label>Cups</label>
                    <input id="cups" type="number" min="1" value="1">
                </div>
            </div>

            <div id="error" class="error"></div>

            <button id="predictBtn" onclick="predict()">
                <span id="predictBtnText">Predict</span>
                <span id="predictBtnLoading" class="loader" hidden></span>
            </button>
        </section>

        <!-- Right: Result & Suggestions -->
        <section class="card card-result" id="resultCard" style="display:none;">
            <h2 class="card-title">Result Overview</h2>

            <div class="result-grid">
                <div>
                    <div class="result-item-label">☕ Caffeine Intake</div>
                    <div id="resCaffeine" class="result-item-value">-</div>
                </div>
                <div>
                    <div class="result-item-label">❤️ Predicted Heart Rate</div>
                    <div id="resHeartRate" class="result-item-value">-</div>
                </div>
                <div>
                    <div class="result-item-label">😴 Predicted Sleep</div>
                    <div id="resSleep" class="result-item-value">-</div>
                </div>
                <div>
                    <div class="result-item-label">⚠ Recommended Daily Limit</div>
                    <div id="resLimit" class="result-item-value">-</div>
                </div>
            </div>

            <div class="result-section">
                <div class="result-item-label" id="resSummary">
                    <!-- JS fillin：Today's intake is about XX% of your personalized daily limit. -->
                </div>

                <div class="gauge">
                    <div id="gaugeFill" class="gauge-fill"></div>
                </div>

                <div id="riskTag" class="risk-tag risk-low">
                    Risk level: Low
                </div>
            </div>

            <div class="result-section">
                <h3 class="section-title">Health Insights</h3>
                <p id="healthInsight" class="health-insight">
                    <!-- JS automaticlly generate suggestions -->
                </p>
            </div>
        </section>
    </div>

    <!-- Buttom：Trend & History -->
    <section class="bottom-layout">
        <div class="card card-chart">
            <h2 class="card-title">Caffeine Trend (Recent Intakes)</h2>
            <canvas id="historyChart" height="140"></canvas>
            <p class="chart-note" id="chartNote"></p>
        </div>

        <div class="card card-history">
            <h2 class="card-title">Recent Intakes</h2>
            <div id="history" class="history"></div>
        </div>
    </section>
</main>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
